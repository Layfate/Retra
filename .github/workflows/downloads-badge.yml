name: Retra downloads badge

# Counts release downloads and publishes the README badge to `docs/badges/` on `main`
# (https://raw.githubusercontent.com/<owner>/<repo>/main/docs/badges/downloads.svg), so the
# badge is served by GitHub itself instead of a shields.io lookup that can time out.

on:
  schedule:
    - cron: '23 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retra-downloads-badge
  cancel-in-progress: false

jobs:
  badge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build badge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq '.[].assets[].download_count' | awk '{s+=$1} END {print s+0}')
          node tools/downloads-badge/build-badge.cjs "$count" docs/badges/downloads.svg

      - name: Publish badge
        shell: bash
        run: |
          git add -- docs/badges/downloads.svg
          if git diff --cached --quiet; then
            echo "Badge unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update downloads badge"
          git pull --rebase origin main
          git push origin HEAD:main
