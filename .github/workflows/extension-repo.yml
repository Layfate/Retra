name: Retra extension repository

# Rebuilds the extension repository published in `extensions/` on `main`
# (https://raw.githubusercontent.com/<owner>/<repo>/main/extensions/index.json) so the
# website catalogs pick up new games and artwork. The default index publishes
# one extension containing PokéHarbor, PokeMundo and Roms Games sources.

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retra-extension-repo
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout builder
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build repository
        shell: bash
        env:
          # Lifts the GitHub API rate limit for the libretro-thumbnails box art index.
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/extension-repo/build-repo.cjs "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/extensions/" extensions

      - name: Publish changes
        shell: bash
        run: |
          git add -A -- extensions
          if git diff --cached --quiet; then
            echo "Catalogs unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh Retra extension catalogs"
          git pull --rebase origin main
          git push origin HEAD:main
