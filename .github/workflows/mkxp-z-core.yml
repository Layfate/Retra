# Builds the mkxp-z libretro core (RPG Maker XP/VX/VX Ace) for Android.
# Mirrors the libretro GitLab CI of white-axe/mkxp-z@libretro, whose own Android artifacts expire after 10 minutes.
# Run it from the Actions tab, download the artifacts, and copy each .so into app/src/main/jniLibs/<abi>/.
name: Build mkxp-z core

on:
  workflow_dispatch:
    inputs:
      stage1_run:
        description: "Reuse stage1 from this earlier run ID (skips ~20 min); leave empty to rebuild it"
        required: false
        default: ""

env:
  MKXPZ_REPO: white-axe/mkxp-z
  MKXPZ_REF: 650cb0888a07d0b5044e131160ddfa53feaf595b # libretro branch, 2026-06-30
  # same NDK as libretro's own Android CI image; NDK 30's libc++ breaks openal-soft's bundled fmt
  NDK_VERSION: 29.0.14206865

jobs:
  stage1:
    # compiles the sandboxed Ruby interpreter to WebAssembly and then to portable C (wasm2c)
    if: inputs.stage1_run == ''
    runs-on: ubuntu-latest
    container: debian:stable-slim
    steps:
      - name: Install tools
        run: |
          apt update
          apt install -y git curl build-essential automake libtool zip universal-ctags ruby
          curl -Lo /tmp/wasi-sdk.tar.gz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-30/wasi-sdk-30.0-x86_64-linux.tar.gz
          mkdir /opt/wasi-sdk && tar -xzf /tmp/wasi-sdk.tar.gz -C /opt/wasi-sdk --strip-components=1
          curl -Lo /tmp/binaryen.tar.gz https://github.com/WebAssembly/binaryen/releases/download/version_126/binaryen-version_126-x86_64-linux.tar.gz
          mkdir /opt/binaryen && tar -xzf /tmp/binaryen.tar.gz -C /opt/binaryen --strip-components=1
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MKXPZ_REPO }}
          ref: ${{ env.MKXPZ_REF }}
      - name: Build stage1
        run: cd libretro && make -j"$(nproc)" WASI_SDK=/opt/wasi-sdk WASM_OPT=/opt/binaryen/bin/wasm-opt
      - uses: actions/upload-artifact@v4
        with:
          name: stage1
          path: libretro/build/libretro-stage1/

  android:
    needs: stage1
    if: ${{ !cancelled() && (needs.stage1.result == 'success' || needs.stage1.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # let each ABI report its own result
      matrix:
        include:
          - { platform: android-arm64, abi: arm64-v8a }
          - { platform: android-x86_64, abi: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.MKXPZ_REPO }}
          ref: ${{ env.MKXPZ_REF }}
      - uses: actions/download-artifact@v4
        with:
          name: stage1
          path: libretro/build/libretro-stage1
          run-id: ${{ inputs.stage1_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
      - name: Install meson
        run: python3 -m pip install --break-system-packages meson ninja
      - name: Build core
        run: |
          LLVM="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64"
          # -j2: the wasm2c'd Ruby sources are huge and thin LTO is memory hungry on 16 GB runners
          make -f Makefile.libretro -j2 platform=${{ matrix.platform }} ANDROID_NDK_CLANG="$LLVM" ANDROID_NDK_LLVM="$LLVM"
          "$LLVM/bin/llvm-strip" mkxp-z_libretro_android.so
          # Android only extracts lib*.so from the APK
          mv mkxp-z_libretro_android.so libmkxp-z_libretro_android.so
      - uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-${{ matrix.abi }}
          path: libmkxp-z_libretro_android.so
